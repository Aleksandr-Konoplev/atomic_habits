[project]
name = "atomic-habits"
version = "0.1.0"
description = ""
authors = [
    {name = "Konoplev Aleksandr",email = "konoplev.a.a0000@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "asgiref (==3.11.1)",
    "black (==26.1.0)",
    "click (==8.3.1)",
    "colorama (==0.4.6)",
    "django (==6.0.3)",
    "djangorestframework (==3.16.1)",
    "dotenv (==0.9.9)",
    "flake8 (==7.3.0)",
    "isort (==8.0.1)",
    "librt (==0.8.1)",
    "mccabe (==0.7.0)",
    "mypy (==1.19.1)",
    "mypy-extensions (==1.1.0)",
    "packaging (==26.0)",
    "pathspec (==1.0.4)",
    "platformdirs (==4.9.2)",
    "psycopg2 (==2.9.11)",
    "pycodestyle (==2.14.0)",
    "pyflakes (==3.4.0)",
    "python-dotenv (==1.2.2)",
    "pytokens (==0.4.1)",
    "sqlparse (==0.5.5)",
    "typing-extensions (==4.15.0)",
    "tzdata (==2025.3)",
    "pillow (>=12.1.1,<13.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-filter (>=25.2,<26.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.2.1,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ["py311"]
skip-string-normalization = true
exclude = '''
/(
    migrations
  | venv
  | .venv
)/
'''

[tool.flake8]
max-line-length = 119
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "venv",
    ".venv"
]
ignore = [
    "E203",
    "W503"
]
